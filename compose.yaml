name: flights-bigdata

services:
  namenode:
    image: apache/hadoop:3.5.0
    hostname: namenode
    user: root
    command: ["hdfs", "namenode"]
    env_file:
      - ./infra/hadoop.env
    environment:
      # Ścieżka zgodna z dfs.namenode.name.dir. Pusty wolumin jest formatowany przy pierwszym starcie.
      ENSURE_NAMENODE_DIR: /data/name
    volumes:
      - namenode_data:/data
    ports:
      - "127.0.0.1:9870:9870"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "hdfs", "dfsadmin", "-safemode", "get"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  datanode:
    image: apache/hadoop:3.5.0
    hostname: datanode
    user: root
    command: ["hdfs", "datanode"]
    env_file:
      - ./infra/hadoop.env
    environment:
      HDFS-SITE.XML_dfs.datanode.hostname: localhost
    volumes:
      - datanode_data:/data
    ports:
      - "127.0.0.1:9864:9864"
    depends_on:
      namenode:
        condition: service_healthy
    mem_limit: 1g

  resourcemanager:
    image: apache/hadoop:3.5.0
    hostname: resourcemanager
    user: root
    command: ["yarn", "resourcemanager"]
    env_file:
      - ./infra/hadoop.env
      - ./infra/yarn.env
    volumes:
      # Kod i manifest dla zadań Hadoop Streaming (tylko do odczytu).
      - ./scripts:/project/scripts:ro
      - ./data:/project/data:ro
    ports:
      - "127.0.0.1:8088:8088"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://resourcemanager:8088/ws/v1/cluster/info"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  nodemanager:
    image: apache/hadoop:3.5.0
    hostname: nodemanager
    user: root
    command: ["yarn", "nodemanager"]
    env_file:
      - ./infra/hadoop.env
      - ./infra/yarn.env
    depends_on:
      resourcemanager:
        condition: service_healthy
      namenode:
        condition: service_healthy
    mem_limit: 3g

  # Serwer historii zadań: zakończone zadania MapReduce (liczniki, czasy, zadania map/reduce)
  # są widoczne pod http://localhost:19888 także po restarcie YARN.
  historyserver:
    image: apache/hadoop:3.5.0
    hostname: historyserver
    user: root
    command: ["mapred", "historyserver"]
    env_file:
      - ./infra/hadoop.env
      - ./infra/yarn.env
    ports:
      - "127.0.0.1:19888:19888"
    depends_on:
      namenode:
        condition: service_healthy
    restart: unless-stopped  # po starcie HDFS bywa chwilę w safe mode, wtedy serwer startuje ponownie
    mem_limit: 1g

  # Lokalna baza MongoDB: przyjmuje tylko połączenia szyfrowane (TLS) i wymaga logowania.
  # Certyfikaty tworzy scripts/make_certs.py, hasła są w pliku .env (wzór: .env.example).
  mongodb:
    image: mongo:8.0
    hostname: mongodb
    command: ["mongod", "--auth",
              "--tlsMode", "requireTLS",
              "--tlsCertificateKeyFile", "/etc/mongo-tls/server.pem",
              "--tlsCAFile", "/etc/mongo-tls/ca.pem",
              # Klient musi ufać serwerowi, ale nie musi mieć własnego certyfikatu.
              "--tlsAllowConnectionsWithoutCertificates"]
    environment:
      # Użytkownicy powstają tylko przy pierwszym starcie pustej bazy.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_DATABASE: ${MONGO_DATABASE}
      MONGO_APP_USER: ${MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD}
    volumes:
      - mongodb_data:/data/db
      - ./secrets/tls:/etc/mongo-tls:ro
      - ./infra/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--tls", "--tlsCAFile", "/etc/mongo-tls/ca.pem",
             "--host", "localhost", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 1g

volumes:
  namenode_data:
  datanode_data:
  mongodb_data:
